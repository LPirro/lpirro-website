  <script src="/assets/picks.js"></script>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    (function () {
      var input = document.getElementById("q");
      var list = document.getElementById("picks-list");
      var count = document.getElementById("count");
      var empty = document.getElementById("empty");

      // lowercase, no accents, so "caffe" finds "Caffè"
      function fold(text) {
        return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      if (!PICKS.length) {
        input.closest(".search").hidden = true;
        empty.textContent = "Ancora nessun prodotto. Torna presto!";
        empty.hidden = false;
        return;
      }

      var rows = PICKS.map(function (pick) {
        var item = renderPick(pick);
        list.appendChild(item);
        return {
          item: item,
          text: fold([pick.product, pick.brand, (PLATFORMS[pick.platform] || {}).label || "", pick.keywords || ""].join(" "))
        };
      });

      var searchTimer;
      function filter() {
        var words = fold(input.value).split(/\s+/).filter(Boolean);
        var shown = 0;
        rows.forEach(function (row) {
          var match = words.every(function (word) { return row.text.indexOf(word) !== -1; });
          row.item.hidden = !match;
          if (match) shown++;
        });
        count.textContent = shown + (shown === 1 ? " prodotto" : " prodotti");
        empty.hidden = shown > 0;
        empty.textContent = "Nessun risultato per \u201c" + input.value.trim() + "\u201d. Prova con il nome del brand.";

        clearTimeout(searchTimer);
        if (words.length) searchTimer = setTimeout(function () {
          if (typeof gtag === "function") gtag("event", "search", { search_term: input.value.trim(), results: shown });
        }, 1200);
      }

      input.addEventListener("input", filter);
      filter();
      focusPick(decodeURIComponent(location.hash.slice(1)));
    })();
  </script>
