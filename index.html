  <script src="assets/picks.js"></script>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    // latest products on the home, the rest (with search) on /video/
    (function () {
      var VISIBLE = 3;
      if (!PICKS.length) return;
      var target = decodeURIComponent(location.hash.slice(1));
      if (PICKS.findIndex(function (p) { return p.id === target; }) >= VISIBLE) {
        location.replace("/video/#" + target);
        return;
      }

      var list = document.getElementById("picks-list");
      PICKS.slice(0, VISIBLE).forEach(function (pick, i) {
        var item = renderPick(pick);
        item.classList.add("a");
        item.style.setProperty("--i", 7 + i);
        list.appendChild(item);
      });
      document.getElementById("picks").hidden = false;
      focusPick(target);
    })();

    // latest YouTube videos: /api/videos reads the channel's long-form feed (see api/videos.js)
    (function () {
      var MAX = 8;
      var CHANNEL = "https://www.youtube.com/@itsleopirro/videos";
      var section = document.getElementById("videos");
      var reel = document.getElementById("reel");
      var prev = section.querySelector('[data-dir="-1"]');
      var next = section.querySelector('[data-dir="1"]');

      function thumb(id) {
        var img = new Image(320, 180);
        img.alt = "";
        img.loading = "lazy";
        img.src = "https://i.ytimg.com/vi/" + id + "/hq720.jpg";
        // YouTube answers a 120×90 placeholder when the HD thumbnail doesn't exist
        img.onload = function () {
          if (img.naturalWidth < 300) img.src = "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg";
        };
        return img;
      }

      function card(v) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "clip";
        a.href = v.url;
        a.target = "_blank";
        a.rel = "noopener";

        var frame = document.createElement("span");
        frame.className = "thumb";
        frame.appendChild(thumb(v.id));
        frame.insertAdjacentHTML("beforeend", '<span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>');

        var title = document.createElement("span");
        title.className = "clip-title";
        title.textContent = v.title;

        a.append(frame, title);
        a.addEventListener("click", function () {
          if (typeof gtag === "function") gtag("event", "video_click", { video: v.title });
        });
        li.appendChild(a);
        return li;
      }

      function step() { return reel.children[1].offsetLeft - reel.children[0].offsetLeft; }
      function atEnd() { return reel.scrollLeft + reel.clientWidth >= reel.scrollWidth - 4; }

      function nav(restart) {
        function update() {
          prev.disabled = reel.scrollLeft <= 4;
          next.disabled = atEnd();
        }
        prev.addEventListener("click", function () { reel.scrollBy({ left: -step(), behavior: "smooth" }); restart(); });
        next.addEventListener("click", function () { reel.scrollBy({ left: step(), behavior: "smooth" }); restart(); });
        reel.addEventListener("scroll", update, { passive: true });
        update();
      }

      // slides one card every 5s (back to the start at the end); waits while the mouse is
      // over it or a finger is on it, and starts counting again after any manual move
      function autoplay() {
        var hover = false, touching = false, timer;
        function tick() {
          if (hover || touching || document.hidden) return;
          if (atEnd()) reel.scrollTo({ left: 0, behavior: "smooth" });
          else reel.scrollBy({ left: step(), behavior: "smooth" });
        }
        function restart() { clearInterval(timer); timer = setInterval(tick, 5000); }
        reel.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") hover = true; });
        reel.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") { hover = false; restart(); } });
        reel.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") touching = true; });
        ["pointerup", "pointercancel"].forEach(function (type) {
          window.addEventListener(type, function () { if (touching) { touching = false; restart(); } });
        });
        reel.addEventListener("wheel", restart, { passive: true });
        document.addEventListener("visibilitychange", restart);
        restart();
        return restart;
      }

      fetch("/api/videos")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) {
          var videos = data.videos.filter(function (v) { return !v.short; }).slice(0, MAX);
          if (!videos.length) return;
          videos.forEach(function (v) { reel.appendChild(card(v)); });
          reel.insertAdjacentHTML("beforeend",
            '<li><a class="clip clip-all" href="' + CHANNEL + '" target="_blank" rel="noopener">' +
            '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>' +
            '<span>Tutti i video</span></a></li>');
          section.hidden = false;
          var restart = matchMedia("(prefers-reduced-motion: reduce)").matches ? function () {} : autoplay();
          nav(restart);
        })
        .catch(function () { /* no feed, no section */ });
    })();

    // the orb reacts: it speeds up a little under the mouse, and bursts on a tap or click anywhere
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var avatar = document.querySelector(".avatar");
      var aura = avatar.querySelector(".aura");
      var blobs = aura.querySelectorAll(".blob");
      var hover = false, calm = null;

      // only the CSS animations (blobs, aurora, ripple): the one-off bursts keep their own pace
      function rate(r) {
        aura.getAnimations({ subtree: true }).forEach(function (a) {
          if ("animationName" in a) a.playbackRate = r;
        });
      }

      function burst() {
        rate(3.5);
        clearTimeout(calm);
        calm = setTimeout(function () { calm = null; rate(hover ? 1.6 : 1); }, 1200);

        // the whole aura swells and flares, on top of its speech pulse
        aura.animate([
          { transform: "scale(1)", filter: "brightness(1) saturate(1)" },
          { transform: "scale(1.4)", filter: "brightness(1.6) saturate(1.25)", offset: 0.22 },
          { transform: "scale(1)", filter: "brightness(1) saturate(1)" }
        ], { duration: 1000, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", composite: "add" });

        // blobs jump outward from the centre and fall back
        blobs.forEach(function (blob, i) {
          var angle = Math.PI / 4 + i * Math.PI / 2;
          var dx = Math.round(Math.cos(angle) * 38), dy = Math.round(Math.sin(angle) * 38);
          blob.animate([
            { transform: "translate(0, 0)" },
            { transform: "translate(" + dx + "%, " + dy + "%)", offset: 0.25 },
            { transform: "translate(0, 0)" }
          ], { duration: 900, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", composite: "add" });
        });
      }

      avatar.addEventListener("pointerenter", function (e) {
        if (e.pointerType === "mouse") { hover = true; if (!calm) rate(1.6); }
      });
      avatar.addEventListener("pointerleave", function (e) {
        if (e.pointerType === "mouse") { hover = false; if (!calm) rate(1); }
      });

      // mouse: on press, for instant feedback; touch: on the tap itself, so starting
      // to scroll the page doesn't count
      var touch = false;
      document.addEventListener("pointerdown", function (e) {
        touch = e.pointerType !== "mouse";
        if (!touch && !e.button) burst();
      });
      document.addEventListener("click", function () { if (touch) burst(); });
    })();

    document.querySelectorAll(".social").forEach(function (link) {
      link.addEventListener("click", function () {
        if (typeof gtag === "function") gtag("event", "channel_click", { channel: link.getAttribute("aria-label") });
      });
    });
  </script>
